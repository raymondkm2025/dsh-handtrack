<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-handtrack - 3D Hand Tracking Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: Consolas, monospace;
    }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #video {
      position: fixed; top: 10px; left: 10px;
      width: 320px; height: 240px;
      border-radius: 8px; opacity: 0.85;
      z-index: 10; pointer-events: none;
      transform: scaleX(-1);
    }
    #hud {
      position: fixed; top: 10px; right: 10px;
      color: #0f8; font-size: 13px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px; border-radius: 6px;
      z-index: 10; pointer-events: none;
      text-align: right;
    }
    #hud .status { color: #0f8; font-weight: bold; }
    #hud .status.off { color: #f33; }
    #hud .fps { color: #888; font-size: 11px; margin-top: 4px; }
    #hud .tips { color: #aaa; font-size: 10px; margin-top: 8px; line-height: 1.5; }
    #loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #0f8; font-size: 18px; z-index: 100;
      text-align: center;
    }
    #loading .dot { animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="status" id="status">INIT...</div>
    <div class="fps" id="fps">FPS: --</div>
    <div class="tips">drag: orbit | scroll: zoom</div>
  </div>
  <div id="loading">Loading Three.js + MediaPipe<span class="dot">...</span></div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const W = window.innerWidth, H = window.innerHeight
    const CAM_W = 640, CAM_H = 480
    const FINGER_JOINT = ['left_shoulder','left_elbow','head','right_elbow','right_shoulder']
    const FINGER_TIP_MP = [4, 8, 12, 16, 20]
    const FINGER_COLORS = [
      [1.0,0.2,0.2],[1.0,0.6,0.0],[1.0,1.0,0.2],[0.2,1.0,0.2],[0.2,0.6,1.0]
    ]
    const ROBOT_JOINTS = {
      head:        [0.0,  1.8, 0.0],
      left_shoulder: [-0.8, 1.2, 0.0],
      left_elbow:  [-1.2, 0.6, 0.0],
      right_shoulder: [0.8, 1.2, 0.0],
      right_elbow: [1.2,  0.6, 0.0],
      torso:       [0.0,  0.8, 0.0],
    }
    const SMOOTH_WIN = 5
    const BG_COLOR = [0.02, 0.02, 0.05]

    // ── State ────────────────────────────────────────────────────────────────
    const smoothed = Array.from({length:5}, () => [])
    const robotJoints = {}
    for (const k in ROBOT_JOINTS) robotJoints[k] = new Float32Array(ROBOT_JOINTS[k])

    let cameraAngleY = 30, cameraAngleX = 10, cameraDist = 5
    let isDragging = false, lastMX = 0, lastMY = 0

    // ── Three.js scene ───────────────────────────────────────────────────────
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(BG_COLOR[0], BG_COLOR[1], BG_COLOR[2])
    scene.fog = new THREE.FogExp2(new THREE.Color(BG_COLOR[0], BG_COLOR[1], BG_COLOR[2]), 0.04)

    const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100)
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') })
    renderer.setSize(W, H)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))

    function updateCameraPos() {
      const radY = cameraAngleY * Math.PI / 180
      const radX = cameraAngleX * Math.PI / 180
      camera.position.set(
        cameraDist * Math.sin(radY) * Math.cos(radX),
        cameraDist * Math.sin(radX) + 1.0,
        cameraDist * Math.cos(radY) * Math.cos(radX)
      )
      camera.lookAt(0, 0.5, 0)
    }
    updateCameraPos()

    // Lights
    scene.add(new THREE.AmbientLight(0x404060, 0.8))
    const dir = new THREE.DirectionalLight(0xffffff, 1.2)
    dir.position.set(3, 5, 4)
    scene.add(dir)
    const rim = new THREE.PointLight(0x4488ff, 0.6, 10)
    rim.position.set(-3, 2, -2)
    scene.add(rim)

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 })
    )
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -1.0
    scene.add(ground)
    scene.add(new THREE.GridHelper(20, 20, 0x222244, 0x111133).translateY(-0.99))

    // Robot joints
    const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, emissive: 0x2244aa, emissiveIntensity: 0.3 })
    const robotMeshes = {}
    for (const j in ROBOT_JOINTS) {
      const m = new THREE.Mesh(sphereGeo, bodyMat.clone())
      m.position.set(...ROBOT_JOINTS[j])
      scene.add(m)
      robotMeshes[j] = m
    }

    // String lines
    const stringLines = []
    for (let f = 0; f < 5; f++) {
      const pts = new Float32Array(6)
      const geo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pts, 3))
      const mat = new THREE.LineBasicMaterial({
        color: new THREE.Color(FINGER_COLORS[f][0], FINGER_COLORS[f][1], FINGER_COLORS[f][2]),
        transparent: true, opacity: 0.7
      })
      const ln = new THREE.Line(geo, mat)
      ln.visible = false
      scene.add(ln)
      stringLines.push(ln)
    }

    // Hand skeleton
    const handPoints = new Float32Array(21 * 3)
    const handGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(handPoints, 3))
    const handLine = new THREE.Line(handGeo, new THREE.LineBasicMaterial({ color: 0x00ffaa }))
    handLine.visible = false
    scene.add(handLine)

    // Bone connections
    const bonePairs = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[12,13],[13,14],[14,15],[15,16],[12,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]]
    const boneGeo = new THREE.BufferGeometry().setFromPoints(bonePairs.map(([a,b]) => new THREE.Vector3(handPoints[a*3], handPoints[a*3+1], handPoints[a*3+2])))
    const boneLine = new THREE.LineSegments(boneGeo, new THREE.LineBasicMaterial({ color: 0x00aa66, transparent: true, opacity: 0.5 }))
    boneLine.visible = false
    scene.add(boneLine)

    // ── Mouse controls ───────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas')
    canvas.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY })
    canvas.addEventListener('mouseup', () => isDragging = false)
    canvas.addEventListener('mouseleave', () => isDragging = false)
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return
      const dx = e.clientX - lastMX, dy = e.clientY - lastMY
      cameraAngleY -= dx * 0.3
      cameraAngleX = Math.max(-80, Math.min(80, cameraAngleX + dy * 0.3))
      updateCameraPos()
      lastMX = e.clientX; lastMY = e.clientY
    })
    canvas.addEventListener('wheel', e => {
      e.preventDefault()
      cameraDist = Math.max(2, Math.min(12, cameraDist + e.deltaY * 0.005))
      updateCameraPos()
    }, { passive: false })

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    // ── Camera ───────────────────────────────────────────────────────────────
    const video = document.getElementById('video')
    const statusEl = document.getElementById('status')
    const fpsEl = document.getElementById('fps')
    const loadingEl = document.getElementById('loading')

    let camReady = false
    let fpsFrames = 0, fpsTime = 0

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: CAM_W, height: CAM_H, facingMode: 'user' }
        })
        video.srcObject = stream
        camReady = true
        statusEl.textContent = 'AI AGENT: ACTIVE'
        statusEl.className = 'status'
      } catch (err) {
        console.warn('[handtrack] camera unavailable:', err.message)
        statusEl.textContent = 'CAMERA: OFFLINE'
        statusEl.className = 'status off'
      }
    }

    // ── MediaPipe Hands ──────────────────────────────────────────────────────
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    })
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 })
    hands.onResults(onHandResults)

    function onHandResults(results) {
      if (!results.multiHandLandmarks || !results.multiHandLandmarks.length) {
        handLine.visible = false
        boneLine.visible = false
        for (const ln of stringLines) ln.visible = false
        return
      }

      const lm = results.multiHandLandmarks[0]
      handLine.visible = true
      boneLine.visible = true

      // Update hand skeleton points
      for (let i = 0; i < 21; i++) {
        handPoints[i*3]   = (0.5 - lm[i].x) * 4.0
        handPoints[i*3+1] = (0.5 - lm[i].y) * 3.0
        handPoints[i*3+2] = -lm[i].z * 2.0
      }
      handLine.geometry.attributes.position.needsUpdate = true

      // Update strings
      for (let f = 0; f < 5; f++) {
        const tip = lm[FINGER_TIP_MP[f]]
        const buf = smoothed[f]
        buf.push([(0.5 - tip.x) * 4.0, (0.5 - tip.y) * 3.0, -tip.z * 2.0])
        if (buf.length > SMOOTH_WIN) buf.shift()
        const avg = buf.reduce((s, v) => [s[0]+v[0], s[1]+v[1], s[2]+v[2]], [0,0,0]).map(v => v / buf.length)

        const jp = robotJoints[FINGER_JOINT[f]]
        const pos = stringLines[f].geometry.attributes.position.array
        pos[0]=avg[0]; pos[1]=avg[1]; pos[2]=avg[2]
        pos[3]=jp[0]; pos[4]=jp[1]; pos[5]=jp[2]
        stringLines[f].geometry.attributes.position.needsUpdate = true
        stringLines[f].visible = true
      }
    }

    // ── Animation loop ───────────────────────────────────────────────────────
    const clock = new THREE.Clock()

    function animate() {
      requestAnimationFrame(animate)
      const dt = clock.getDelta()
      const t = clock.getElapsedTime()

      // FPS counter
      fpsFrames++; fpsTime += dt
      if (fpsTime >= 1.0) { fpsEl.textContent = `FPS: ${fpsFrames}`; fpsFrames = 0; fpsTime = 0 }

      // Idle robot animation
      for (const k in robotMeshes) {
        const base = ROBOT_JOINTS[k]
        robotMeshes[k].position.y = base[1] + Math.sin(t * 0.8 + base[1] * 2) * 0.05
      }

      renderer.render(scene, camera)
    }

    // ── Start ────────────────────────────────────────────────────────────────
    Promise.all([initCamera(), hands.send({image: video})])
      .then(() => {
        loadingEl.style.display = 'none'
        animate()

        // Start camera processing
        const cameraUtils = new Camera(video, {
          onFrame: async () => {
            await hands.send({image: video})
          },
          width: CAM_W,
          height: CAM_H
        })
        cameraUtils.start()
      })
      .catch(err => {
        console.error('[handtrack] init failed:', err)
        loadingEl.textContent = 'ERROR: ' + err.message
      })
  </script>
</body>
</html>
