<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-handtrack - 3D Hand Tracking</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; overflow: hidden; font-family: Consolas, monospace; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #video {
      position: fixed; bottom: 20px; left: 20px;
      width: 320px; height: 240px;
      border-radius: 8px; opacity: 0.9;
      z-index: 10; pointer-events: none;
      transform: scaleX(-1);
      border: 2px solid rgba(0,255,136,0.3);
    }
    #hud {
      position: fixed; top: 10px; right: 10px;
      color: #0f8; font-size: 12px;
      background: rgba(0,0,0,0.7);
      padding: 10px 14px; border-radius: 6px;
      z-index: 10; pointer-events: none;
      text-align: right; min-width: 220px;
    }
    #hud .status { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    #hud .fps { color: #888; font-size: 11px; }
    #hud .tips { color: #666; font-size: 10px; margin-top: 10px; line-height: 1.6; }
    #loading {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #0f8; font-size: 18px; z-index: 100;
      text-align: center;
    }
    #loading .dot { animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="status" id="status">LOADING...</div>
    <div class="fps" id="fps">FPS: --</div>
    <div class="tips">drag: orbit | scroll: zoom</div>
  </div>
  <div id="loading">Loading Three.js + HandTrack<span class="dot">...</span></div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <!-- HandTrack -->
  <script src="https://cdn.jsdelivr.net/npm/handtrackjs@0.1.0/dist/handtrack.min.js"></script>

  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const ROBOT_JOINTS = {
      head:[0,1.8,0], left_shoulder:[-0.8,1.2,0], left_elbow:[-1.2,0.6,0],
      right_shoulder:[0.8,1.2,0], right_elbow:[1.2,0.6,0], torso:[0,0.8,0]
    }
    const FINGER_JOINT = ['left_shoulder','left_elbow','head','right_elbow','right_shoulder']
    const FINGER_COLORS = [[1,0.2,0.2],[1,0.6,0],[1,1,0.2],[0.2,1,0.2],[0.2,0.6,1]]
    const BG = [0.02,0.02,0.05]
    let camAngleY = 30, camAngleX = 10, camDist = 5
    let isDragging = false, lastMX = 0, lastMY = 0
    let t = 0

    const STATUS_EL = document.getElementById('status')
    const FPS_EL = document.getElementById('fps')
    const LOADING_EL = document.getElementById('loading')
    const VIDEO_EL = document.getElementById('video')

    // ── Three.js scene ───────────────────────────────────────────────────────
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(BG[0], BG[1], BG[2])
    scene.fog = new THREE.FogExp2(new THREE.Color(BG[0], BG[1], BG[2]), 0.04)

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100)
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))

    function updateCam() {
      const ry = camAngleY*Math.PI/180, rx = camAngleX*Math.PI/180
      camera.position.set(camDist*Math.sin(ry)*Math.cos(rx), camDist*Math.sin(rx)+1, camDist*Math.cos(ry)*Math.cos(rx))
      camera.lookAt(0, 0.5, 0)
    }
    updateCam()

    // Lights
    scene.add(new THREE.AmbientLight(0x404060, 0.8))
    const dir = new THREE.DirectionalLight(0xffffff, 1.2)
    dir.position.set(3,5,4); scene.add(dir)
    const rim = new THREE.PointLight(0x4488ff, 0.6, 10)
    rim.position.set(-3,2,-2); scene.add(rim)

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20,20),
      new THREE.MeshStandardMaterial({color:0x111122, roughness:0.9})
    )
    ground.rotation.x = -Math.PI/2; ground.position.y = -1
    scene.add(ground)
    scene.add(new THREE.GridHelper(20,20,0x222244,0x111133).translateY(-0.99))

    // Robot joints
    const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16)
    const bodyMat = new THREE.MeshStandardMaterial({color:0x4488ff, emissive:0x2244aa, emissiveIntensity:0.3})
    const robotMeshes = {}
    for (const k in ROBOT_JOINTS) {
      const m = new THREE.Mesh(sphereGeo, bodyMat.clone())
      m.position.set(...ROBOT_JOINTS[k])
      scene.add(m); robotMeshes[k] = m
    }

    // String lines (finger tip -> robot joint)
    const stringLines = []
    for (let f = 0; f < 5; f++) {
      const pts = new Float32Array(6)
      const g = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pts, 3))
      const c = FINGER_COLORS[f]
      const l = new THREE.Line(g, new THREE.LineBasicMaterial({color: new THREE.Color(c[0],c[1],c[2]), transparent:true, opacity:0.7}))
      l.visible = false; scene.add(l); stringLines.push(l)
    }

    // ── Mouse controls ───────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas')
    canvas.addEventListener('mousedown', e => { isDragging=true; lastMX=e.clientX; lastMY=e.clientY })
    canvas.addEventListener('mouseup', () => isDragging=false)
    canvas.addEventListener('mouseleave', () => isDragging=false)
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return
      camAngleY -= (e.clientX-lastMX)*0.3
      camAngleX = Math.max(-80, Math.min(80, camAngleX+(e.clientY-lastMY)*0.3))
      updateCam(); lastMX=e.clientX; lastMY=e.clientY
    })
    canvas.addEventListener('wheel', e => {
      e.preventDefault()
      camDist = Math.max(2, Math.min(12, camDist+e.deltaY*0.005))
      updateCam()
    }, {passive:false})
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
    })

    // ── HandTrack setup ──────────────────────────────────────────────────────
    let model = null
    let predictedPositions = [] // Array of [x,y,w,h] per detection
    let fpsCnt = 0, fpsTime = 0

    async function start() {
      try {
        // Start camera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'user' }
        })
        VIDEO_EL.srcObject = stream
        await VIDEO_EL.play()
        
        STATUS_EL.textContent = 'Loading model...'
        STATUS_EL.style.color = '#ff8'
        
        // Load HandTrack model
        model = await handtrack.load(0.5, 0.3)
        STATUS_EL.textContent = 'Starting detection...'
        
        // Start predicting
        handtrack.startVideo(VIDEO_EL, 640, 480)
        handtrack.onPrediction((results) => {
          predictedPositions = results
          updateHUD(results)
        })
        
        LOADING_EL.style.display = 'none'
        STATUS_EL.textContent = 'AI AGENT: ACTIVE'
        STATUS_EL.style.color = '#0f8'
        
        animate()
        
      } catch(e) {
        console.error('[handtrack] Error:', e)
        LOADING_EL.textContent = 'ERROR: ' + e.message
        STATUS_EL.textContent = 'ERROR'
        STATUS_EL.style.color = '#f33'
      }
    }

    function updateHUD(results) {
      if (results.length > 0) {
        STATUS_EL.textContent = 'HAND DETECTED'
        STATUS_EL.style.color = '#0f8'
      } else {
        STATUS_EL.textContent = 'AI AGENT: STANDBY'
        STATUS_EL.style.color = '#f80'
      }
    }

    // ── Animation loop ───────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate)
      const dt = 0.016
      t += dt

      // FPS
      fpsCnt++; fpsTime += dt
      if (fpsTime >= 1) { 
        FPS_EL.textContent = 'FPS: ' + fpsCnt 
        fpsCnt = 0; fpsTime = 0 
      }

      // Clear string lines
      for (const l of stringLines) l.visible = false

      // Update strings based on predictions
      if (predictedPositions.length > 0) {
        const det = predictedPositions[0]
        const [x, y, w, h] = det
        
        // Map detection position to 3D space
        const hand3D = [
          (x / 640) * 4 - 2,  // x
          (y / 480) * 3 - 1.5, // y
          -0.5  // z (fixed depth)
        ]
        
        // Update strings for each finger
        for (let f = 0; f < 5; f++) {
          const jp = ROBOT_JOINTS[FINGER_JOINT[f]]
          const pos = stringLines[f].geometry.attributes.position.array
          // Finger tip offset from detection center
          const fx = hand3D[0] + (f - 2) * 0.3
          const fy = hand3D[1] + 0.3
          const fz = hand3D[2]
          pos[0] = fx; pos[1] = fy; pos[2] = fz
          pos[3] = jp[0]; pos[4] = jp[1]; pos[5] = jp[2]
          stringLines[f].geometry.attributes.position.needsUpdate = true
          stringLines[f].visible = true
        }
      } else {
        // Demo mode: animate a fake hand
        for (let f = 0; f < 5; f++) {
          const jp = ROBOT_JOINTS[FINGER_JOINT[f]]
          const pos = stringLines[f].geometry.attributes.position.array
          const wave = Math.sin(t * 2 + f * 0.5) * 0.5
          pos[0] = wave
          pos[1] = 0.5 + f * 0.2
          pos[2] = -0.5
          pos[3] = jp[0]; pos[4] = jp[1]; pos[5] = jp[2]
          stringLines[f].geometry.attributes.position.needsUpdate = true
          stringLines[f].visible = true
        }
      }

      // Idle robot animation
      for (const k in robotMeshes) {
        const b = ROBOT_JOINTS[k]
        robotMeshes[k].position.y = b[1] + Math.sin(t*0.8+b[1]*2)*0.05
      }

      renderer.render(scene, camera)
    }

    start()
  </script>
</body>
</html>
