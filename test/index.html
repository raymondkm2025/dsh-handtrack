<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-handtrack - 3D Hand Tracking Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; overflow: hidden; font-family: Consolas, monospace; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 10px; right: 10px;
      color: #0f8; font-size: 12px;
      background: rgba(0,0,0,0.7);
      padding: 10px 14px; border-radius: 6px;
      z-index: 10; pointer-events: none;
      text-align: right; min-width: 220px;
    }
    #hud .status { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    #hud .fps { color: #888; font-size: 11px; }
    #hud .tips { color: #666; font-size: 10px; margin-top: 10px; line-height: 1.6; }
    #error-msg {
      display: none;
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(200,50,50,0.9); color: #fff;
      padding: 12px 20px; border-radius: 8px;
      font-size: 13px; max-width: 600px; z-index: 200;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div class="status" id="status">DEMO MODE</div>
    <div class="fps" id="fps">FPS: --</div>
    <div class="tips">drag: orbit | scroll: zoom<br>模拟手部动作中...</div>
  </div>
  <div id="error-msg"></div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  
  <script>
    // ── Config ───────────────────────────────────────────────────────────────
    const ROBOT_JOINTS = {
      head:[0,1.8,0], left_shoulder:[-0.8,1.2,0], left_elbow:[-1.2,0.6,0],
      right_shoulder:[0.8,1.2,0], right_elbow:[1.2,0.6,0], torso:[0,0.8,0]
    }
    const FINGER_JOINT = ['left_shoulder','left_elbow','head','right_elbow','right_shoulder']
    const FINGER_COLORS = [[1,0.2,0.2],[1,0.6,0],[1,1,0.2],[0.2,1,0.2],[0.2,0.6,1]]
    const BG = [0.02,0.02,0.05]
    let camAngleY = 30, camAngleX = 10, camDist = 5
    let isDragging = false, lastMX = 0, lastMY = 0
    let t = 0

    // Demo hand positions (animated)
    const demoHand = []
    for (let i = 0; i < 21; i++) demoHand.push([0,0,0])

    // ── Three.js scene ───────────────────────────────────────────────────────
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(BG[0], BG[1], BG[2])
    scene.fog = new THREE.FogExp2(new THREE.Color(BG[0], BG[1], BG[2]), 0.04)

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100)
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('canvas') })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))

    function updateCam() {
      const ry = camAngleY*Math.PI/180, rx = camAngleX*Math.PI/180
      camera.position.set(camDist*Math.sin(ry)*Math.cos(rx), camDist*Math.sin(rx)+1, camDist*Math.cos(ry)*Math.cos(rx))
      camera.lookAt(0, 0.5, 0)
    }
    updateCam()

    // Lights
    scene.add(new THREE.AmbientLight(0x404060, 0.8))
    const dir = new THREE.DirectionalLight(0xffffff, 1.2)
    dir.position.set(3,5,4); scene.add(dir)
    const rim = new THREE.PointLight(0x4488ff, 0.6, 10)
    rim.position.set(-3,2,-2); scene.add(rim)

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20,20),
      new THREE.MeshStandardMaterial({color:0x111122, roughness:0.9})
    )
    ground.rotation.x = -Math.PI/2; ground.position.y = -1
    scene.add(ground)
    scene.add(new THREE.GridHelper(20,20,0x222244,0x111133).translateY(-0.99))

    // Robot joints
    const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16)
    const bodyMat = new THREE.MeshStandardMaterial({color:0x4488ff, emissive:0x2244aa, emissiveIntensity:0.3})
    const robotMeshes = {}
    for (const k in ROBOT_JOINTS) {
      const m = new THREE.Mesh(sphereGeo, bodyMat.clone())
      m.position.set(...ROBOT_JOINTS[k])
      scene.add(m); robotMeshes[k] = m
    }

    // String lines
    const stringLines = []
    for (let f = 0; f < 5; f++) {
      const pts = new Float32Array(6)
      const g = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pts, 3))
      const c = FINGER_COLORS[f]
      const l = new THREE.Line(g, new THREE.LineBasicMaterial({color: new THREE.Color(c[0],c[1],c[2]), transparent:true, opacity:0.7}))
      l.visible = false; scene.add(l); stringLines.push(l)
    }

    // Hand skeleton (21 landmarks)
    const hp = new Float32Array(21*3)
    const handLine = new THREE.Line(
      new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(hp,3)),
      new THREE.LineBasicMaterial({color:0x00ffaa})
    )
    handLine.visible = true; scene.add(handLine)

    // Bone pairs
    const bones = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[12,13],[13,14],[14,15],[15,16],[12,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]]
    const bp = []
    for (const [a,b] of bones) { bp.push(hp[a*3],hp[a*3+1],hp[a*3+2],hp[b*3],hp[b*3+1],hp[b*3+2]) }
    const boneLine = new THREE.LineSegments(
      new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(bp,3)),
      new THREE.LineBasicMaterial({color:0x00aa66, transparent:true, opacity:0.5})
    )
    boneLine.visible = true; scene.add(boneLine)

    // ── Mouse controls ───────────────────────────────────────────────────────
    const canvas = document.getElementById('canvas')
    canvas.addEventListener('mousedown', e => { isDragging=true; lastMX=e.clientX; lastMY=e.clientY })
    canvas.addEventListener('mouseup', () => isDragging=false)
    canvas.addEventListener('mouseleave', () => isDragging=false)
    canvas.addEventListener('mousemove', e => {
      if (!isDragging) return
      camAngleY -= (e.clientX-lastMX)*0.3
      camAngleX = Math.max(-80, Math.min(80, camAngleX+(e.clientY-lastMY)*0.3))
      updateCam(); lastMX=e.clientX; lastMY=e.clientY
    })
    canvas.addEventListener('wheel', e => {
      e.preventDefault()
      camDist = Math.max(2, Math.min(12, camDist+e.deltaY*0.005))
      updateCam()
    }, {passive:false})
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
    })

    // ── Animation ────────────────────────────────────────────────────────────
    const clock = new THREE.Clock()
    let fpsCnt=0, fpsTime=0

    function animate() {
      requestAnimationFrame(animate)
      const dt = clock.getDelta()
      t += dt

      // FPS
      fpsCnt++; fpsTime += dt
      if (fpsTime >= 1) { 
        document.getElementById('fps').textContent = 'FPS: '+fpsCnt 
        fpsCnt=0; fpsTime=0 
      }

      // Demo hand animation (wave motion)
      for (let i = 0; i < 21; i++) {
        const baseX = (i % 5) * 0.4 - 0.8
        const baseY = 0.5 + Math.floor(i / 5) * 0.3
        demoHand[i][0] = baseX + Math.sin(t*2 + i*0.3) * 0.2
        demoHand[i][1] = baseY + Math.sin(t*3 + i*0.2) * 0.1
        demoHand[i][2] = Math.sin(t*1.5 + i*0.1) * 0.3
      }

      // Update hand skeleton
      for (let i = 0; i < 21; i++) {
        hp[i*3]=demoHand[i][0]*4
        hp[i*3+1]=demoHand[i][1]*3
        hp[i*3+2]=demoHand[i][2]*2
      }
      handLine.geometry.attributes.position.needsUpdate = true

      // Update strings
      const fingerTips = [4, 8, 12, 16, 20]
      for (let f = 0; f < 5; f++) {
        const tip = demoHand[fingerTips[f]]
        const jp = ROBOT_JOINTS[FINGER_JOINT[f]]
        const pos = stringLines[f].geometry.attributes.position.array
        pos[0]=tip[0]*4; pos[1]=tip[1]*3; pos[2]=tip[2]*2
        pos[3]=jp[0]; pos[4]=jp[1]; pos[5]=jp[2]
        stringLines[f].geometry.attributes.position.needsUpdate = true
        stringLines[f].visible = true
      }

      // Idle robot animation
      for (const k in robotMeshes) {
        const b = ROBOT_JOINTS[k]
        robotMeshes[k].position.y = b[1] + Math.sin(t*0.8+b[1]*2)*0.05
      }

      renderer.render(scene, camera)
    }

    animate()
  </script>
</body>
</html>
